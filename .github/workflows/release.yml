name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            A browser front end for FLIMKit. Every desktop mode (Single FOV,
            Tile Stitch, Phasor, Batch, Machine IRF) plus the project browser
            and tools, driven from a web page on http://127.0.0.1:8765.

            ```
            pip install flimkit-web-ui
            ```

            FLIMKit discovers it through the `flimkit.plugins` entry point, so
            there's nothing else to wire up. On start the server comes up and
            Tools > Open Web UI opens it in your browser.

            The wheel and sdist are attached below for anyone installing offline,
            or into `~/.flimkit/plugins/`.
