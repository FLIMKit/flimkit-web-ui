name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FLIMKit
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps 'flimkit @ git+https://github.com/FLIMKit/FLIMKit'

      - name: Install the add-on
        run: |
          pip install -e '.[test]'
          pip install pytest-timeout

      - name: Run tests
        run: pytest -q --timeout=120 --timeout-method=thread

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the page scripts parse
        run: |
          for f in flimkit_web_ui/*.js; do
            node --check "$f"
          done
